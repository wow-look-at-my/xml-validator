name: 'Validate XML'
description: 'Run xml-validator to check XML files for well-formedness and against an XSD schema'
branding:
  icon: 'check-circle'
  color: 'green'

inputs:
  files:
    description: 'Space-separated files or glob patterns to validate. When omitted, auto-discovers every *.xml and *.xsd file in the workspace.'
    required: false
    default: ''
  schema:
    description: 'Path to an XSD schema to validate every file against. When omitted, only XML 1.1 well-formedness is checked.'
    required: false
    default: ''
  args:
    description: 'Additional CLI arguments passed to each invocation.'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    # Every step carrying logic runs as TypeScript (tsc-checked, on Node) via
    # the org's reusable typescript action -- no hand-written, non-portable
    # shell.
    #
    # The cli module publishes a native binary per platform, so the common run
    # installs one file and never sees a Go toolchain. os/arch default to the
    # runner's own. required: false reports a missing artifact as an output
    # instead of failing the step, which is what leaves the build below as the
    # fallback rather than a dead end. The path is named because Windows wants
    # the .exe suffix to run the file.
    - name: Download xml-validator from buildhost
      id: download
      uses: wow-look-at-my/buildhost/.github/actions/buildhost-download@master
      with:
        project: xml-validator
        required: 'false'
        path: ${{ runner.temp }}/xml-validator${{ runner.os == 'Windows' && '.exe' || '' }}

    # A download proves bytes arrived, never that they run here: a fat APE
    # exits 121 before main on a runner with no loader for it. --help is the
    # cheapest thing that separates the two.
    - name: Check the downloaded binary runs
      id: usable
      if: steps.download.outputs.downloaded == 'true'
      uses: wow-look-at-my/actions@typescript#latest
      env:
        XMLV_BIN: ${{ steps.download.outputs.path }}
      with:
        script: |
          const bin = (process.env.XMLV_BIN ?? '').trim();
          const code = await exec.exec(bin, ['--help'], { ignoreReturnCode: true, silent: true });
          if (code !== 0) {
            core.warning(`${bin} exits ${code} on --help; building from source instead`);
            return false;
          }
          return true;

    # The binary is the cli module, and this repository has no root go.mod.
    # Both this step and the build below must name cli/ explicitly.
    - name: Setup Go
      if: steps.usable.outputs.result != 'true'
      uses: actions/setup-go@v5
      with:
        go-version-file: '${{ github.action_path }}/cli/go.mod'
        cache: false

    - name: Compute cache key
      id: cache-key
      if: steps.usable.outputs.result != 'true'
      uses: wow-look-at-my/actions@typescript#latest
      env:
        ACTION_DIR: ${{ github.action_path }}
      with:
        script: |
          const nodeCrypto = require('crypto');
          const actionDir = process.env.ACTION_DIR ?? '';

          const include = (name: string): boolean =>
            name.endsWith('.go') || name === 'go.mod' || name === 'go.sum';

          const sources: string[] = [];
          const walk = (dir: string): void => {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) {
                walk(full);
              } else if (entry.isFile() && include(entry.name)) {
                sources.push(full);
              }
            }
          };
          walk(actionDir);
          sources.sort();

          const hash = nodeCrypto.createHash('sha256');
          for (const file of sources) {
            hash.update(path.relative(actionDir, file));
            hash.update('\0');
            hash.update(fs.readFileSync(file));
            hash.update('\0');
          }
          const digest: string = hash.digest('hex');
          core.info(`Hashed ${sources.length} Go source file(s)`);
          return digest;

    - name: Cache xml-validator binary
      id: cache
      if: steps.usable.outputs.result != 'true'
      uses: actions/cache@v4
      with:
        path: ${{ runner.tool_cache }}/xml-validator/bin
        key: xml-validator-${{ runner.os }}-${{ runner.arch }}-${{ fromJSON(steps.cache-key.outputs.result) }}

    - name: Build xml-validator
      if: steps.usable.outputs.result != 'true' && steps.cache.outputs.cache-hit != 'true'
      uses: wow-look-at-my/actions@typescript#latest
      env:
        ACTION_DIR: ${{ github.action_path }}
      with:
        script: |
          const actionDir = process.env.ACTION_DIR ?? '';
          const binName = process.platform === 'win32' ? 'xml-validator.exe' : 'xml-validator';
          const binDir = path.join(runner.tool_cache, 'xml-validator', 'bin');
          await io.mkdirP(binDir);
          const cliDir = path.join(actionDir, 'cli');
          await exec.exec('go', ['build', '-o', path.join(binDir, binName), './cmd/xml-validator'], { cwd: cliDir });

    - name: Run xml-validator
      uses: wow-look-at-my/actions@typescript#latest
      env:
        XMLV_BIN: ${{ steps.usable.outputs.result == 'true' && steps.download.outputs.path || '' }}
        XMLV_FILES: ${{ inputs.files }}
        XMLV_SCHEMA: ${{ inputs.schema }}
        XMLV_ARGS: ${{ inputs.args }}
      with:
        script: |
          const binName = process.platform === 'win32' ? 'xml-validator.exe' : 'xml-validator';
          const built = path.join(runner.tool_cache, 'xml-validator', 'bin', binName);
          const bin = (process.env.XMLV_BIN ?? '').trim() || built;

          const filesInput = (process.env.XMLV_FILES ?? '').trim();
          const schema = (process.env.XMLV_SCHEMA ?? '').trim();
          const extraArgs = (process.env.XMLV_ARGS ?? '').trim();

          const base: string[] = [];
          if (schema) base.push('--schema', schema);
          const extra = extraArgs ? extraArgs.split(/\s+/) : [];

          // An XSD is an XML document, so discovery covers it. A schema this
          // tool cannot parse is a finding, not a file to walk past.
          const validatable = (name: string): boolean => {
            const lower = name.toLowerCase();
            return lower.endsWith('.xml') || lower.endsWith('.xsd');
          };

          const discover = (): string[] => {
            const out: string[] = [];
            const skip = new Set(['.git', 'node_modules']);
            const walk = (dir: string): void => {
              for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
                if (entry.isDirectory()) {
                  if (!skip.has(entry.name)) walk(path.join(dir, entry.name));
                } else if (entry.isFile() && validatable(entry.name)) {
                  out.push(path.join(dir, entry.name));
                }
              }
            };
            walk('.');
            return out.sort();
          };

          let files: string[];
          if (filesInput) {
            files = [];
            for (const token of filesInput.split(/\s+/)) {
              if (/[*?[]/.test(token)) {
                files.push(...fs.globSync(token));
              } else {
                files.push(token);
              }
            }
          } else {
            files = discover();
            if (files.length === 0) {
              core.info('No XML or XSD files found');
              return;
            }
            core.info(`Auto-discovered ${files.length} XML/XSD file(s)`);
          }

          let failed = 0;
          for (const file of files) {
            core.startGroup(`xml-validator ${file}`);
            const code = await exec.exec(bin, [...base, ...extra, file], { ignoreReturnCode: true });
            if (code !== 0) failed++;
            core.endGroup();
          }

          if (failed > 0) {
            core.setFailed(`${failed} of ${files.length} file(s) failed validation`);
          }

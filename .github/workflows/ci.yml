name: CI

on:
  push:

permissions:
  id-token: write
  contents: write
  actions: read
  checks: read
  deployments: write
  artifact-metadata: write

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # One job per module. The action runs `go-toolchain matrix`, which
          # gates the module in its working directory; it does not walk a tree
          # of modules the way a bare `go-toolchain` does.
          - module: reader
            autorelease: 'false'
          - module: writer
            autorelease: 'false'
          - module: validator
            autorelease: 'false'
          # cli carries the published binary and the dats suites, so it is the
          # one job that releases. A library module has nothing to publish.
          - module: cli
            autorelease: 'true'
    name: test (${{ matrix.module }})
    steps:
      - uses: actions/checkout@v4
      # dats picks its sandbox backend at run time -- bubblewrap first, docker
      # as the fallback. Under docker the command runs inside the image, so the
      # binary the dats phase staged is not the binary that runs, and the cli
      # suites fail on a runner that happens to lack bwrap. Installing it makes
      # the choice the same one every time.
      - run: sudo apt-get install -y bubblewrap
      - uses: wow-look-at-my/go-toolchain@v1
        with:
          working-directory: ${{ matrix.module }}
          autorelease: ${{ matrix.autorelease }}

name: CI

on:
  push:

permissions:
  id-token: write
  contents: write
  actions: read
  checks: read
  deployments: write
  artifact-metadata: write

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # One job per module. The action runs `go-toolchain matrix`, which
          # gates the module in its working directory; it does not walk a tree
          # of modules the way a bare `go-toolchain` does.
          - module: reader
            autorelease: 'false'
          - module: writer
            autorelease: 'false'
          - module: validator
            autorelease: 'false'
          # cli carries the published binary and the dats suites, so it is the
          # one job that releases. A library module has nothing to publish.
          - module: cli
            autorelease: 'true'
    name: test (${{ matrix.module }})
    steps:
      - uses: actions/checkout@v4
      # Native per-platform binaries, not the default single fat APE. The dats
      # suites run the built binary inside a plain debian container, where an
      # APE has no loader and exits 121 before main runs.
      - uses: wow-look-at-my/go-toolchain@v1
        with:
          working-directory: ${{ matrix.module }}
          autorelease: ${{ matrix.autorelease }}
          os: linux,darwin,windows
          arch: amd64,arm64

  # The action is the one surface no Go test reaches, and every repository in
  # the org runs it. This job runs it from the checkout, so an install that
  # cannot produce a working binary fails here instead of in each consumer.
  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Accept a valid document and a schema
        uses: ./
        with:
          files: 'testdata/action/valid.xml testdata/action/valid.xsd'

      - name: Validate against a schema
        uses: ./
        with:
          files: 'testdata/action/valid.xml'
          schema: 'testdata/action/valid.xsd'

      # The negative control. Without it every check above also passes for an
      # action that reports success whatever the validator answered.
      - name: Reject an XML 1.0 document
        id: reject
        continue-on-error: true
        uses: ./
        with:
          files: 'testdata/action/xml10.xml'

      - name: The rejection must have failed its step
        uses: wow-look-at-my/actions@typescript#latest
        env:
          OUTCOME: ${{ steps.reject.outcome }}
        with:
          script: |
            const outcome = (process.env.OUTCOME ?? '').trim();
            if (outcome !== 'failure') {
              core.setFailed(`the action reported ${outcome || 'nothing'} for an XML 1.0 document`);
            }
